buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.4.32'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'kotlin'

apply from: rootProject.file('gradle/bundled-runtime.gradle')

version = '1.0.0'
group = 'jp.apple.rtm'
archivesBaseName = 'AppleExtended-Modified'

sourceCompatibility = 1.8
targetCompatibility = 1.8

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    accessTransformer = file('src/main/resources/META-INF/fix-rtm_at.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    bundledRuntime 'com.anatawa12.sai:sai:0.0.2'
    bundledRuntime 'io.sigpipe:jbsdiff:1.0'
    bundledRuntime 'org.sejda.imageio:webp-imageio:0.1.6'
    bundledRuntime 'org.codehaus.groovy:groovy-jsr223:2.5.23'
    bundledRuntime 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.4.32'
}

sourceSets {
    main {
        kotlin {
            srcDirs = ['src/main/java']
        }
    }
}

tasks.withType(JavaCompile).all {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = '1.8'
        languageVersion = '1.4'
        apiVersion = '1.4'
    }
}

tasks.withType(Test).all {
    enabled = false
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.class'
        include '**/*.kotlin_module'
        include 'assets/**'
        include 'META-INF/services/**'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'mcmod.info'
    }


    manifest {
        attributes([
                "Specification-Title": "apple-rtm",
                "Specification-Vendor": "apple-rtm",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"apple-rtm",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "FMLCorePlugin": "com.anatawa12.fixRtm.asm.FixRtmCorePlugin",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true",
                "FMLAT": "fix-rtm_at.cfg"
        ])
    }
}

jar.finalizedBy('reobfJar')

// Copying outside the project is opt-in and requires an explicit destination.
['Test': 'testModsDir', 'Server': 'serverModsDir'].each { target, propertyName ->
    tasks.create(name: "copyJarTo${target}", type: Copy) {
        group = 'distribution'
        description = "Copy the reobfuscated mod using -P${propertyName}=<mods-directory>."
        dependsOn 'jar', 'reobfJar'
        from { tasks.jar.archivePath }
        into {
            def destination = project.findProperty(propertyName)
            if (!destination) throw new GradleException("Specify -P${propertyName}=<mods-directory> to copy the JAR.")
            file(destination)
        }
    }
}
